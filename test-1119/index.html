<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="冒险者公会">
<meta name="theme-color" content="#000000"><link rel="manifest" href="ui/manifest.webmanifest">
<meta name="robots" content="noindex,nofollow"><title>Playtest test-1119</title>
<style>html,body{margin:0;height:100%;background:#0b0a10;color:#ddd;font:18px system-ui,sans-serif}
main{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;padding:0 20px;text-align:center}
input{font:20px system-ui;padding:10px 14px;border-radius:8px;border:1px solid #555;background:#15131c;color:#fff;width:min(320px,80vw);text-align:center}
button{font:18px system-ui;padding:10px 28px;border-radius:8px;border:0;background:#e0b04a;color:#1a1408;cursor:pointer}
#err{color:#f77;min-height:1.4em;font-size:15px}small{color:#888}</style></head>
<body><main><div>试玩口令 / Passcode</div>
<input id="pw" type="password" autocomplete="off" autofocus>
<button id="go">进入 / Enter</button><div id="err"></div>
<small>建议横屏、全屏游玩 · Landscape recommended</small></main>
<script>
var H='7bd1c380ee445fa127d37f442cecd9143b467546728adac68a7fb530f821d404',K='wtg.gate',Q=location.search+location.hash;
function enter(){location.replace('ui/index.html'+(location.search?location.search+(/[?&]profile=/.test(location.search)?'':'&profile=t1119'):'?profile=t1119')+location.hash);}
try{if(localStorage.getItem(K)===H)enter();}catch(e){}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function go(){var v=document.getElementById('pw').value.trim();if(!v)return;
 if(await sha(v)===H){try{localStorage.setItem(K,H);}catch(e){}enter();}
 else document.getElementById('err').textContent='口令不对 / Wrong passcode';}
document.getElementById('go').onclick=go;
document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')go();};
</script></body></html>
